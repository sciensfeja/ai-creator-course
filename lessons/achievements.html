            rarity: 'legendary',

            coins: 100,
            lesson: 'general',

        }
    ];

    const RANKS = [
        { name: '🌱 Новичок', minXP: 0, color: '#a0a3b8' },
        { name: '⚔️ Ученик', minXP: 300, color: '#00c8ff' },
        { name: '️ Адепт', minXP: 800, color: '#7850ff' },
        { name: '🔮 Мастер', minXP: 1500, color: '#ff50a0' },
        { name: '👑 Легенда', minXP: 2500, color: '#ffb400' }
    ];

    let unlockedIds = JSON.parse(localStorage.getItem('ai_creator_achievements') || '[]');

    const urlParams = new URLSearchParams(window.location.search);
    const unlockParam = urlParams.get('unlock');
    if (unlockParam && !unlockedIds.includes(unlockParam)) {
        unlockAchievement(unlockParam);
        window.history.replaceState({}, document.title, window.location.pathname);
    }

    function unlockAchievement(id) {
        if (unlockedIds.includes(id)) return;
        
        const achievement = ACHIEVEMENTS.find(a => a.id === id);
        if (!achievement) return;

        unlockedIds.push(id);
        localStorage.setItem('ai_creator_achievements', JSON.stringify(unlockedIds));
        
        showNotification(achievement);
        renderAchievements();
        updateStats();
    }

    function showNotification(achievement) {
        const notif = document.getElementById('notification');
        const text = document.getElementById('notification-text');
        text.textContent = `${achievement.icon} ${achievement.name} — +${achievement.xp} XP, +${achievement.coins} 💰`;
        notif.classList.add('show');
        setTimeout(() => notif.classList.remove('show'), 4000);
    }

    function getCurrentRank(xp) {
        let current = RANKS[0];
        let next = RANKS[1];
        for (let i = 0; i < RANKS.length; i++) {
            if (xp >= RANKS[i].minXP) {
                current = RANKS[i];
                next = RANKS[i + 1] || null;
            }
        }
        return { current, next };
    }

    function updateStats() {
        const unlocked = ACHIEVEMENTS.filter(a => unlockedIds.includes(a.id));
        const totalXP = unlocked.reduce((sum, a) => sum + a.xp, 0);
        const totalCoins = unlocked.reduce((sum, a) => sum + a.coins, 0);
        const progress = Math.round((unlocked.length / ACHIEVEMENTS.length) * 100);

        document.getElementById('unlocked-count').textContent = `${unlocked.length}/${ACHIEVEMENTS.length}`;
        document.getElementById('total-xp').textContent = totalXP;
        document.getElementById('total-coins').textContent = totalCoins;
        document.getElementById('progress-percent').textContent = `${progress}%`;

        const { current, next } = getCurrentRank(totalXP);
        document.getElementById('rank-name').textContent = current.name;
        
        if (next) {
            const progressInRank = ((totalXP - current.minXP) / (next.minXP - current.minXP)) * 100;
            document.getElementById('rank-fill').style.width = `${Math.min(progressInRank, 100)}%`;
            document.getElementById('rank-text').textContent = `До следующего ранга: ${totalXP} / ${next.minXP} XP`;
        } else {
            document.getElementById('rank-fill').style.width = '100%';
            document.getElementById('rank-text').textContent = `Максимальный ранг достигнут! 🎉`;
        }
    }

    function renderAchievements(filter = 'all') {
        const container = document.getElementById('achievements-container');
        container.innerHTML = '';

        const sections = {};
        ACHIEVEMENTS.forEach(a => {
            if (!sections[a.section]) sections[a.section] = [];
            sections[a.section].push(a);
        });

        Object.keys(sections).forEach(sectionName => {
            const section = document.createElement('div');
            section.className = 'achievements-section';
            
            const title = document.createElement('h2');
            title.className = 'section-title';
            title.innerHTML = `📖 ${sectionName}`;
            section.appendChild(title);

            const grid = document.createElement('div');
            grid.className = 'achievements-grid';

            sections[sectionName].forEach(achievement => {
                const isUnlocked = unlockedIds.includes(achievement.id);
                
                if (filter === 'unlocked' && !isUnlocked) return;
                if (filter === 'locked' && isUnlocked) return;
                if (['common', 'rare', 'epic', 'legendary'].includes(filter) && achievement.rarity !== filter) return;

                const card = document.createElement('div');
                card.className = `achievement ${achievement.rarity} ${isUnlocked ? 'unlocked' : 'locked'}`;
                card.innerHTML = `
                    <div class="achievement-header">
                        <div class="achievement-icon">${achievement.icon}</div>
                        <div class="achievement-info">
                            <div class="achievement-name">${achievement.name}</div>
                            <span class="achievement-rarity rarity-${achievement.rarity}">
                                ${getRarityName(achievement.rarity)}
                            </span>
                        </div>
                    </div>
                    <div class="achievement-desc">${achievement.desc}</div>
                    <div class="achievement-footer">
                        <span class="achievement-reward">+${achievement.xp} XP · +${achievement.coins} 💰</span>
                        <span class="achievement-status ${isUnlocked ? 'status-unlocked' : 'status-locked'}">
                            ${isUnlocked ? '✅ Получено' : '🔒 Закрыто'}
                        </span>
                    </div>
                `;
                
                if (!isUnlocked) {
                    card.addEventListener('click', () => {
                        if (confirm(`Разблокировать ачивку "${achievement.name}"? (демо-режим)`)) {
                            unlockAchievement(achievement.id);
                        }
                    });
                }

                grid.appendChild(card);
            });

            if (grid.children.length > 0) {
                section.appendChild(grid);
                container.appendChild(section);
            }
        });
    }

    function getRarityName(rarity) {
        const names = {
            common: '⚪ Обычная',
            rare: '🔵 Редкая',
            epic: '🟣 Эпическая',
            legendary: '🟡 Легендарная'
        };
        return names[rarity] || rarity;
    }

    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderAchievements(btn.dataset.filter);
        });
    });

    document.getElementById('reset-btn').addEventListener('click', () => {
        if (confirm('Точно сбросить весь прогресс? Это действие нельзя отменить!')) {
            localStorage.removeItem('ai_creator_achievements');
            unlockedIds = [];
            renderAchievements();
            updateStats();
            alert('Прогресс сброшен. Начинаем заново! 🚀');
        }
    });

    renderAchievements();
    updateStats();
</script>
